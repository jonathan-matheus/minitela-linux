[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minitela"
version = "0.1.0.dev0"
description = "Native Linux app for the Positivo Vision R15M mini screen"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jonathan Matheus" }]
requires-python = ">=3.11"
dependencies = ["pyserial>=3.5"]
classifiers = [
    "Environment :: X11 Applications :: GTK",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]

[project.scripts]
minitela = "minitela.cli:main"

[project.gui-scripts]
minitela-app = "minitela.ui.app:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["minitela"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
pythonpath = ["tests", "tests/ui"]
filterwarnings = [
    # Deprecations inside PyGObject itself, and the API the fake logind uses in tests.
    "ignore::DeprecationWarning:gi.events",
    "ignore:GLib.unix_signal_add_full is deprecated",
    "ignore:GLib.unix_signal_add is deprecated",
    "ignore:Gio.DBusConnection.register_object is deprecated",
]

[tool.coverage.report]
exclude_also = ["@abstractmethod"]
