name: Flatpak

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  bundle:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v6
      # Builds the manifest and uploads minitela.flatpak as an artifact of the run.
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: minitela.flatpak
          manifest-path: build-aux/flatpak/dev.pragmatico.Minitela.yml
          cache-key: flatpak-builder-${{ hashFiles('build-aux/flatpak/*') }}
